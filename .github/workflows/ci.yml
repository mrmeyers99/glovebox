name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # diff coverage compares against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Diff coverage (changed lines must be 90%+ covered)
        if: github.event_name == 'pull_request'
        working-directory: web
        run: pipx run diff-cover==11.0.4 coverage/lcov.info --compare-branch=origin/${{ github.base_ref }} --fail-under=90
      - run: npm run build

  functions:
    name: Edge Functions check, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # diff coverage compares against the base branch
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check .
      - run: deno lint
      - run: deno test --allow-env --coverage=coverage
      - run: deno coverage coverage --lcov --output=coverage.lcov
      - name: Diff coverage (changed lines must be 90%+ covered)
        if: github.event_name == 'pull_request'
        run: pipx run diff-cover==11.0.4 coverage.lcov --compare-branch=origin/${{ github.base_ref }} --fail-under=90

  database:
    name: Migrations and permission tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6
      - run: bash supabase/tests/run-local.sh
