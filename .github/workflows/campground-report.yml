# TEMPORARY (issue #64): runs the campground coverage report against live
# Overpass, which the development sandbox can't reach, and times the tile
# query against main's. Removed before merge.
name: Campground report (temporary)

on:
  push:
    branches: [claude/project-thread-do4ebf]

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Campground coverage, tiles along Mitchell SD to Waterloo IA
        env:
          CONTACT_EMAIL: https://github.com/mrmeyers99/glovebox
          REPORT_TILE_TIMEOUT_MS: '240000'
        run: >-
          deno run --allow-net --allow-env --allow-read places-worker/campground_report.ts
          42.0_-92.5 42.0_-93.0 42.0_-93.5 42.0_-94.0 42.0_-94.5 42.5_-92.5 42.5_-93.0
          42.5_-93.5 42.5_-94.0 42.5_-94.5 42.5_-95.0 42.5_-95.5 43.0_-95.0 43.0_-95.5
          43.0_-96.0 43.0_-96.5 43.0_-97.0 43.0_-97.5 43.5_-95.5 43.5_-96.0 43.5_-96.5
          43.5_-97.0 43.5_-97.5 43.5_-98.0 43.5_-98.5
          | tee "$GITHUB_STEP_SUMMARY"

  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Time main's tile query against this branch's
        run: |
          git worktree add ../main origin/main
          cat > ../timing.ts <<'TS'
          import { buildQuery as prQuery } from './glovebox/supabase/functions/places-worker/overpass.ts'
          import { buildQuery as mainQuery } from './main/supabase/functions/places-worker/overpass.ts'
          import { tileBounds } from './glovebox/supabase/functions/places-worker/tiles.ts'
          const ua = 'Glovebox/1.0 (road-trip planner; https://github.com/mrmeyers99/glovebox)'
          for (const tile of ['43.5_-98.0', '43.5_-97.0', '42.5_-92.5', '43.0_-95.5']) {
            for (const [label, build] of [['main', mainQuery], ['pr', prQuery]] as const) {
              const url = new URL('https://overpass-api.de/api/interpreter')
              url.searchParams.set('data', build(tileBounds(tile)))
              const t0 = Date.now()
              try {
                const res = await fetch(url, { headers: { 'user-agent': ua, accept: 'application/json' }, signal: AbortSignal.timeout(180_000) })
                const text = await res.text()
                let n = '?'
                try { n = String(JSON.parse(text).elements.length) } catch { /* not JSON */ }
                console.log(`${tile} ${label}: HTTP ${res.status}, ${n} elements, ${text.length} bytes, ${Date.now() - t0} ms`)
              } catch (e) {
                console.log(`${tile} ${label}: ${e instanceof Error ? e.message : e} after ${Date.now() - t0} ms`)
              }
              await new Promise((r) => setTimeout(r, 3000))
            }
          }
          TS
          cd .. && deno run --allow-net --allow-read timing.ts | tee "$GITHUB_STEP_SUMMARY"
