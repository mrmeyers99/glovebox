name: Deploy database

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
    inputs:
      mark_applied:
        description: >-
          Optional: migration versions (space-separated) to mark as already
          applied instead of pushing, e.g. 20261124000000 if you ran it by hand.
        required: false
        default: ''

# Never run two migrations at once.
concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      MARK_APPLIED: ${{ inputs.mark_applied }}
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Mark migrations as applied
        if: env.MARK_APPLIED != ''
        run: |
          if [[ ! "$MARK_APPLIED" =~ ^[0-9]+( [0-9]+)*$ ]]; then
            echo "mark_applied must be migration versions separated by spaces" >&2
            exit 1
          fi
          # shellcheck disable=SC2086 # split the space-separated list
          supabase migration repair --status applied $MARK_APPLIED \
            --remote --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Show pending migrations
        if: env.MARK_APPLIED == ''
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply migrations
        if: env.MARK_APPLIED == ''
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
