name: Deploy functions

on:
  push:
    branches: [main]
    # config.jsonc holds each function's settings (and unrelated ones; redeploying is harmless).
    paths: ['supabase/functions/**', 'supabase/config.jsonc']
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Edge Functions to Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      # Deploys don't wait for CI, so run the same checks here first.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check, lint and test functions
        working-directory: supabase/functions
        run: deno check . && deno lint && deno test --allow-env --allow-read

      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      # Deploys every function in supabase/functions with its settings from
      # supabase/config.jsonc. --use-api bundles on Supabase's side (no Docker).
      # Functions deleted from the repo are not removed from the project.
      - name: Deploy functions
        run: >-
          supabase functions deploy --remote="$SUPABASE_PROJECT_ID" --use-api --yes
