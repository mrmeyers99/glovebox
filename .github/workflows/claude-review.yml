name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and dependency-update PRs from Renovate.
    if: github.event.pull_request.draft == false && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow the conventions in CLAUDE.md and
            the requirements in docs/requirements.md. Focus on:
            - Bugs and incorrect behavior, including trip calculations
              (legs, day attribution, skipped stops, costs).
            - Security: every table needs row-level security, and policies
              must match the owner / editor / viewer roles.
            - Database migrations: never edit a migration that has been merged;
              add a new one. Check that permission tests cover policy changes.
            - Simultaneous editing: changes must stay correct when several
              people edit the same trip at once.
            - Missing tests for new logic.

            Be concise. Skip style nits that Prettier or oxlint would catch.

            A blocking issue is a bug, security hole, data-loss risk, broken
            convention from CLAUDE.md (e.g. an edited merged migration, a table
            without RLS, a policy change without permission tests), or missing
            tests for non-trivial new logic. Suggestions and minor nits are not
            blocking.

            When you are done, if you found no blocking issues, approve the PR
            with exactly:
              gh pr review ${{ github.event.pull_request.number }} --approve --body "<one-line summary>"
            Non-blocking suggestions may still be left as comments. If there
            are blocking issues, do not approve; say clearly in your top-level
            comment which issues are blocking.

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review ${{ github.event.pull_request.number }} --approve:*)"
