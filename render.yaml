# Render Blueprint: deploys the web app as a static site.
# Production deploys from main once GitHub checks pass (including database
# migrations); every pull request gets a preview URL.
services:
  - type: web
    name: glovebox
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./web/dist
    autoDeployTrigger: checksPass
    previews:
      generation: automatic
    routes:
      # Single-page app: let the React router handle every path.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite fingerprints built assets, so they can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Set these in the Render dashboard (Supabase: Project Settings → API).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
